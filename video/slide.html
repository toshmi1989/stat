<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>slide</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff}
body{background:radial-gradient(1000px 700px at 10% 0%,#3b6cf6aa,transparent 60%),radial-gradient(900px 700px at 100% 100%,#8a5cf6aa,transparent 60%),#0f172a;display:flex;align-items:center;justify-content:center}
.w{width:1000px;text-align:center}.ic{font-size:76px;animation:pop .8s cubic-bezier(.2,.9,.2,1.3) both;filter:drop-shadow(0 12px 24px rgba(0,0,0,.4))}
h1{font-size:60px;line-height:1.08;margin:18px 0 14px;letter-spacing:-.03em;animation:up .7s .15s both}.sub{font-size:26px;color:#c7d2e6;animation:up .7s .35s both}
.ul{margin:34px auto 0;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}.ul div{background:#ffffff14;border:1px solid #ffffff26;border-radius:16px;padding:14px 20px;font-size:21px;backdrop-filter:blur(6px);animation:up .6s both}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:36px;text-align:left}.two>div{background:#ffffff12;border:1px solid #ffffff26;border-radius:20px;padding:24px 28px;font-size:23px;line-height:1.7;animation:up .7s both}
.two h3{margin:0 0 8px;font-size:26px}.bad h3{color:#ff9b9b}.good h3{color:#7ef0b4}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}</style></head><body><div class="w" id="w"></div>
<script>
const q = new URLSearchParams(location.search), kind = q.get("kind") || "title", w = document.getElementById("w");
const S = {
 title: `<div class="ic">🌡</div><h1>Мониторинг гриппа</h1><div class="sub">Ежедневная статистика по всей республике — за две минуты, без звонков и Excel</div><div class="ul"><div style="animation-delay:.6s">🤖 Telegram-бот</div><div style="animation-delay:.75s">📊 Панель руководителя</div><div style="animation-delay:.9s">🔮 Прогноз</div><div style="animation-delay:1.05s">🔔 Напоминания</div></div>`,
 compare: `<h1 style="font-size:46px">Как было и как стало</h1><div class="two"><div class="bad" style="animation-delay:.3s"><h3>Раньше</h3>📞 Звонки и сообщения в чатах<br>📑 Сводки в разных Excel-файлах<br>⏳ Сведение цифр вручную<br>❓ Непонятно, кто не сдал</div><div class="good" style="animation-delay:.7s"><h3>Теперь</h3>🤖 Ответственный вводит цифры в боте<br>✅ Бот проверяет их сразу<br>📊 Панель обновляется мгновенно<br>🔔 Бот сам напоминает не сдавшим</div></div>`,
 dash: `<div class="ic">📊</div><h1>Панель руководителя</h1><div class="sub">Вся картина по республике — на одном экране</div>`,
 outro: `<div class="ic">✅</div><h1>Меньше рутины — больше времени на людей</h1><div class="sub">Данные в срок · проверка при вводе · история изменений · прогноз нагрузки</div><div class="ul"><div style="animation-delay:.6s">Бот для ответственных</div><div style="animation-delay:.75s">Панель для руководства</div><div style="animation-delay:.9s">Excel и PDF в один клик</div></div>`
};
w.innerHTML = S[kind] || S.title;
</script></body></html>
