<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Мониторинг гриппа</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body class="login-body"><main class="login-card">
<h1>Мониторинг гриппа</h1><p class="muted">Ежедневная статистика по учреждениям здравоохранения</p>
<form method="post" action="/login" autocomplete="on">
<label>Логин<input name="login" value="{{login}}" autocomplete="username" required autofocus></label>
<label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
<p class="err" role="alert">{{error}}</p>
<button class="btn pri" type="submit">Войти</button></form></main></body></html>
